server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback — every unknown path serves index.html so react-router's
    # client-side routes (e.g. /live, /leagues, /match/:id) work correctly
    # on a hard refresh or a direct link, instead of nginx 404ing them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html itself is not
    # cached so deploys take effect immediately on refresh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
