server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback — every unknown path serves index.html so React's own
    # view-switching (or, once wired to a real router, client-side routes)
    # handles it instead of nginx 404ing on a refresh at e.g. /leagues.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html itself is not
    # cached so deploys take effect immediately on refresh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
